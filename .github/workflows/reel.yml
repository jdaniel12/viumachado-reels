name: Gerar Reel

on:
  workflow_dispatch:
    inputs:
      foto_url:
        description: "URL publica da foto do produto"
        required: true
      desc:
        description: "Texto do desconto (ex: 72% OFF)"
        required: true
      preco:
        description: "Texto do preco (ex: R$ 54,99)"
        required: true
      reel_id:
        description: "Identificador do Reel (arquivo reels/<id>.mp4)"
        required: true

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar ambiente
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          [ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ] || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
          pip install --quiet pillow numpy

      - name: Gerar video
        env:
          FOTO_URL: ${{ inputs.foto_url }}
          DESC: ${{ inputs.desc }}
          PRECO: ${{ inputs.preco }}
          REEL_ID: ${{ inputs.reel_id }}
        run: |
          mkdir -p reels
          python3 scripts/reel.py --foto "$FOTO_URL" \
            --logo "https://n8n-viumachado.joaquimdaniel.cloud/webhook/vua-img?id=fixo-logo" \
            --desc "$DESC" --preco "$PRECO" --out "reels/${REEL_ID}.mp4"

      - name: Publicar e limpar antigos
        env:
          REEL_ID: ${{ inputs.reel_id }}
        run: |
          ls -1t reels/*.mp4 | tail -n +11 | xargs -r git rm -q --cached -f || true
          ls -1t reels/*.mp4 | tail -n +11 | xargs -r rm -f
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A reels
          git commit -m "Reel ${REEL_ID}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
