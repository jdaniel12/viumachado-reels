name: Gerar Reel

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "URL publica da arte 9:16 do Story"
        required: true
      reel_id:
        description: "Identificador do Reel (arquivo reels/<id>.mp4)"
        required: true

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar arte
        env:
          IMAGE_URL: ${{ inputs.image_url }}
        run: curl -fsSL --retry 3 -o arte.jpg "$IMAGE_URL"

      - name: Gerar video (ffmpeg)
        env:
          REEL_ID: ${{ inputs.reel_id }}
        run: |
          mkdir -p reels
          ffmpeg -y -loglevel error -loop 1 -i arte.jpg -f lavfi -i anullsrc=r=44100:cl=stereo -t 8 \
            -vf "scale=2160:3840,zoompan=z='1+0.0012*on':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=240:s=1080x1920:fps=30,fade=t=in:st=0:d=0.5,fade=t=out:st=7.5:d=0.5,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 23 -c:a aac -shortest -movflags +faststart "reels/${REEL_ID}.mp4"

      - name: Publicar e limpar antigos
        env:
          REEL_ID: ${{ inputs.reel_id }}
        run: |
          # mantem so os 10 videos mais recentes
          ls -1t reels/*.mp4 | tail -n +11 | xargs -r git rm -q --cached -f || true
          ls -1t reels/*.mp4 | tail -n +11 | xargs -r rm -f
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A reels
          git commit -m "Reel ${REEL_ID}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
